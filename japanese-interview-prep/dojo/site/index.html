<title>Mensetsu Dojo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="8-week Japanese interview speaking plan and practice room for an AI engineer (automotive) application, with FPT company prep.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Old+Mincho:wght@700&display=swap">
<style>
/* Layout concept: an engineer's interview workbook. Calm spec-sheet panels, ruled answer pads with 字数 counters, dashboard-style pace meters. */
:root {
  --paper: #F4F6F9;
  --surface: #FFFFFF;
  --surface-2: #EDF0F5;
  --ink: #141C30;
  --ink-2: #48536C;
  --ink-3: #757F97;
  --line: #D8DDE7;
  --indigo: #2C4EA0;
  --indigo-ink: #FFFFFF;
  --indigo-soft: #E6ECFA;
  --amber: #D9901F;
  --amber-soft: #FFF0D2;
  --green: #2D7F55;
  --green-soft: #E0F2E8;
  --red: #B9382A;
  --red-soft: #FBE6E2;
  --shadow: 0 1px 2px rgba(20,28,48,.05), 0 6px 18px rgba(20,28,48,.06);
  --font-ui: "IBM Plex Sans JP", "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --font-display: "Zen Old Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #0D121D; --surface: #141B2A; --surface-2: #1B2335; --ink: #E6EAF2; --ink-2: #A8B2C7; --ink-3: #7C869D;
    --line: #283149; --indigo: #91AAF1; --indigo-ink: #0D121D; --indigo-soft: #1D2843; --amber: #F0B456; --amber-soft: #36290F;
    --green: #66C893; --green-soft: #12301F; --red: #F08B79; --red-soft: #3B1C17;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #0D121D; --surface: #141B2A; --surface-2: #1B2335; --ink: #E6EAF2; --ink-2: #A8B2C7; --ink-3: #7C869D;
  --line: #283149; --indigo: #91AAF1; --indigo-ink: #0D121D; --indigo-soft: #1D2843; --amber: #F0B456; --amber-soft: #36290F;
  --green: #66C893; --green-soft: #12301F; --red: #F08B79; --red-soft: #3B1C17;
  --shadow: 0 1px 2px rgba(0,0,0,.35), 0 8px 22px rgba(0,0,0,.3); color-scheme: dark;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 15px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 40; background: var(--surface); }
a { color: var(--indigo); }
:focus-visible { outline: 2px solid var(--indigo); outline-offset: 2px; }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.ja { line-height: 1.95; letter-spacing: .02em; }
h1, h2, h3, h4, h5 { text-wrap: balance; margin: 0; line-height: 1.3; }
p { margin: 0; }
ul, ol { margin: 0; padding-left: 1.3em; }
.eyebrow { font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.view-title { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; letter-spacing: -.01em; }
.lede { color: var(--ink-2); max-width: 68ch; }
.view-head { display: flex; flex-direction: column; gap: 8px; }
.label { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; }
.sub { font-size: 13px; color: var(--ink-3); }
.muted { color: var(--ink-2); }
.err { color: var(--red); }
.grow { flex: 1; }

/* top bar */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 30; background: var(--surface); border-bottom: 1px solid var(--line); }
.topbar-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; flex: 1; }
.brand-mark { font-family: var(--font-display); font-size: 19px; letter-spacing: .08em; line-height: 1; padding: 7px 8px 6px; border: 1.5px solid var(--ink); border-radius: 6px; white-space: nowrap; }
.brand-text { display: flex; flex-direction: column; min-width: 0; }
.brand-title { font-weight: 700; font-size: 15px; line-height: 1.25; }
.brand-sub { font-size: 12px; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.top-actions { display: flex; align-items: center; gap: 10px; flex: none; }
.sync { font-size: 12px; color: var(--ink-2); display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.sync::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--ink-3); flex: none; }
.sync[data-s="synced"]::before { background: var(--green); }
.sync[data-s="saving"]::before, .sync[data-s="loading"]::before { background: var(--amber); }
.sync[data-s="offline"]::before, .sync[data-s="error"]::before { background: var(--red); }
.icon-btn { appearance: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 8px; width: 36px; height: 36px; display: inline-grid; place-items: center; cursor: pointer; }
.icon-btn[aria-expanded="true"] { background: var(--indigo-soft); border-color: var(--indigo); }
.tabs { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; border-top: 1px solid var(--line); }
.tabs::-webkit-scrollbar { display: none; }
.tab { text-decoration: none; color: var(--ink-2); padding: 10px 12px 9px; font-weight: 500; font-size: 14px; border-bottom: 2px solid transparent; white-space: nowrap; display: inline-flex; align-items: baseline; gap: 6px; }
.tab-ja { font-size: 11.5px; color: var(--ink-3); }
.tab:hover { color: var(--ink); }
.tab[aria-current="page"] { color: var(--ink); border-bottom-color: var(--indigo); }
.settings { position: absolute; right: max(16px, env(safe-area-inset-right, 0px)); top: calc(100% + 6px); width: min(360px, calc(100vw - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: 16px; display: flex; flex-direction: column; gap: 12px; z-index: 35; }
.settings h3 { font-size: 15px; }
.field { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--ink-2); }
.field select, .field input[type="date"], .field input[type="search"], .field input[type="text"] { font: inherit; font-size: 14px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 7px 10px; min-width: 0; }
.field input[type="range"] { accent-color: var(--indigo); }
.check { display: flex; gap: 8px; align-items: flex-start; font-size: 14px; color: var(--ink); cursor: pointer; }
.check input { margin-top: 4px; accent-color: var(--indigo); }

main { padding-block: 24px 72px; }
.view { display: flex; flex-direction: column; gap: 22px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.card-in { padding: 18px 20px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.card h3 { font-size: 17px; }
.loading { color: var(--ink-3); padding: 40px 0; }

/* buttons, chips */
.btn { appearance: none; font: inherit; font-size: 14px; font-weight: 500; display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer; line-height: 1.25; white-space: nowrap; text-decoration: none; }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--indigo); border-color: var(--indigo); color: var(--indigo-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: transparent; color: var(--indigo); padding-inline: 8px; }
.btn.ghost:hover { background: var(--indigo-soft); }
.btn.sm { font-size: 13px; padding: 5px 9px; }
.btn.danger { color: var(--red); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.playing { background: var(--amber-soft); border-color: var(--amber); color: var(--ink); }
.btn.rec-on { background: var(--red-soft); border-color: var(--red); color: var(--red); }
.ic { width: 16px; height: 16px; flex: none; }
.chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12.5px; padding: 3px 10px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); white-space: nowrap; line-height: 1.5; }
button.chip { cursor: pointer; font-family: inherit; font-size: 13px; }
button.chip:hover { border-color: var(--ink-3); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.chip { max-width: 100%; }
.chip.wrap { white-space: normal; text-align: left; border-radius: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.badge { font-size: 11.5px; padding: 2px 8px; border-radius: 6px; font-weight: 500; white-space: nowrap; }
.badge.now { background: var(--indigo); color: var(--indigo-ink); }
.badge.holiday { background: var(--amber-soft); color: var(--ink); border: 1px solid var(--amber); }
.badge.high { background: var(--green-soft); color: var(--green); }
.badge.medium { background: var(--amber-soft); color: var(--ink-2); }
.badge.low { background: var(--red-soft); color: var(--red); }
a.qlink { font-family: var(--font-mono); font-size: .9em; text-decoration: none; background: var(--indigo-soft); color: var(--indigo); padding: 1px 5px; border-radius: 4px; white-space: nowrap; }
a.qlink:hover { text-decoration: underline; }
.progress { height: 8px; border-radius: 999px; background: var(--surface-2); overflow: hidden; }
.progress > i { display: block; height: 100%; background: var(--green); border-radius: inherit; transition: width .3s ease; }
.only-tts, .only-ai, .only-dict { display: none !important; }
body.has-tts .only-tts { display: inline-flex !important; }
body.has-ai .only-ai { display: flex !important; }
body.has-ai span.only-ai, body.has-ai button.only-ai { display: inline-flex !important; }
body.has-dict .only-dict { display: inline !important; }
body.has-ai .no-ai, body.has-dict .no-dict { display: none !important; }
.callout { border-radius: 10px; padding: 12px 14px; background: var(--surface-2); display: flex; flex-direction: column; gap: 4px; }
.callout.milestone { background: var(--indigo-soft); }
.callout.light { background: var(--amber-soft); }
.callout.human { background: var(--green-soft); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--surface); padding: 10px 16px; border-radius: 10px; font-size: 14px; z-index: 50; max-width: calc(100vw - 32px); box-shadow: var(--shadow); }
.copy-fallback { width: 100%; min-height: 120px; font-family: var(--font-mono); font-size: 12px; margin-top: 8px; }
.spinner { width: 14px; height: 14px; border-radius: 50%; border: 2px solid var(--line); border-top-color: var(--indigo); animation: spin .8s linear infinite; flex: none; }
@keyframes spin { to { transform: rotate(360deg); } }
.thinking { display: flex; align-items: center; gap: 10px; color: var(--ink-2); font-size: 14px; flex-wrap: wrap; }
.inline-confirm { display: inline-flex; gap: 6px; align-items: center; flex-wrap: wrap; font-size: 13px; }

/* plan */
.plan-hero { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 18px; align-items: start; }
@media (max-width: 860px) { .plan-hero { grid-template-columns: 1fr; } }
.plan-main { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.plan-controls { display: flex; flex-wrap: wrap; gap: 16px; align-items: flex-end; }
.plan-controls strong { color: var(--ink); font-weight: 500; font-size: 14px; }
.progress-row { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.progress-row .progress { flex: 1; }
.tw { border-left: 4px solid var(--indigo); }
.tw-head { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.tw-theme { font-family: var(--font-display); font-size: 21px; }
.phases { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 10px; }
.phase { padding: 12px 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.phase.now { border-color: var(--indigo); box-shadow: inset 0 0 0 1px var(--indigo); }
.phase-ja { font-family: var(--font-display); font-size: 17px; }
.phase-focus { font-size: 13px; color: var(--ink-2); }
details.fold > summary { cursor: pointer; font-weight: 500; list-style: none; display: flex; align-items: center; gap: 8px; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: ""; width: 7px; height: 7px; border-right: 2px solid var(--ink-3); border-bottom: 2px solid var(--ink-3); transform: rotate(-45deg); transition: transform .15s; flex: none; }
details.fold[open] > summary::before { transform: rotate(45deg); }
.principles { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; margin-top: 12px; }
.principle { display: flex; flex-direction: column; gap: 4px; }
.principle b { font-size: 14.5px; }
.principle span { font-size: 14px; color: var(--ink-2); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.seg button { appearance: none; border: 0; background: var(--surface); color: var(--ink-2); font: inherit; font-size: 13px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.routine-bar { display: flex; height: 36px; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); }
.routine-bar span { display: flex; align-items: center; justify-content: center; font-size: 12px; border-right: 1px solid var(--line); min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 0 6px; font-family: var(--font-mono); }
.routine-bar span:last-child { border-right: 0; }
.routine-bar span:nth-child(4n+1) { background: var(--indigo-soft); }
.routine-bar span:nth-child(4n+2) { background: var(--green-soft); }
.routine-bar span:nth-child(4n+3) { background: var(--amber-soft); }
.routine-bar span:nth-child(4n+4) { background: var(--surface-2); }
.routine-list { list-style: none; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.routine-list li { display: grid; grid-template-columns: 4.2em 1fr; gap: 10px; }
.routine-list .mins { font-family: var(--font-mono); color: var(--ink-3); font-size: 13px; padding-top: 2px; }
.routine-list b { font-weight: 500; }
.routine-list p { color: var(--ink-2); font-size: 14px; }
.weeks { display: flex; flex-direction: column; gap: 10px; }
details.week { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
details.week[open] { box-shadow: var(--shadow); }
.week-sum { list-style: none; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 18px; cursor: pointer; }
.week-sum::-webkit-details-marker { display: none; }
.week-num { font-size: 22px; font-weight: 500; color: var(--indigo); min-width: 2.1em; }
.week-titles { display: flex; flex-direction: column; min-width: 0; }
.week-ja { font-family: var(--font-display); font-size: 19px; }
.week-en { font-size: 13.5px; color: var(--ink-2); }
.week-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; font-size: 13px; color: var(--ink-2); }
@media (max-width: 640px) { .week-sum { grid-template-columns: auto minmax(0, 1fr); } .week-meta { grid-column: 1 / -1; justify-content: flex-start; } }
.week-body { padding: 16px 18px 18px; display: flex; flex-direction: column; gap: 16px; border-top: 1px solid var(--line); }
.week-cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
@media (max-width: 760px) { .week-cols { grid-template-columns: 1fr; } }
.goals { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
.days { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 14px 22px; }
.day-group h5 { font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--ink-3); font-weight: 500; margin-bottom: 2px; }
.day-group.today h5 { color: var(--indigo); }
ul.tasks { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.task { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 10px; padding: 8px 0; border-bottom: 1px dashed var(--line); }
.task:last-child { border-bottom: 0; }
.task input { width: 18px; height: 18px; margin: 3px 0 0; accent-color: var(--green); }
.task label { display: flex; flex-direction: column; gap: 3px; cursor: pointer; min-width: 0; font-size: 14.5px; }
.task input:checked + label .task-text { color: var(--ink-3); text-decoration: line-through; text-decoration-color: var(--ink-3); }
.task-meta { display: flex; gap: 8px; font-size: 12px; color: var(--ink-3); align-items: center; flex-wrap: wrap; }
.tchip { font-size: 10.5px; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); text-transform: uppercase; letter-spacing: .06em; font-weight: 500; }
textarea.note { width: 100%; min-height: 70px; font: inherit; font-size: 14px; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--surface); color: var(--ink); resize: vertical; }

/* questions */
.q-toolbar { display: flex; flex-direction: column; gap: 10px; }
.q-tools-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.q-tools-row .field { flex-direction: row; align-items: center; gap: 6px; }
.q-search { flex: 1; min-width: 180px; }
.q-list { display: flex; flex-direction: column; gap: 8px; }
.q-card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); scroll-margin-top: 130px; }
.q-card.open { box-shadow: var(--shadow); }
.q-head { appearance: none; border: 0; background: transparent; width: 100%; text-align: left; color: inherit; font: inherit; display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 16px; cursor: pointer; border-radius: var(--r); }
.q-id { font-size: 13px; color: var(--indigo); font-weight: 500; }
.q-titles { display: flex; flex-direction: column; min-width: 0; }
.q-ja { font-size: 16px; font-weight: 500; line-height: 1.6; }
.q-en { font-size: 13px; color: var(--ink-3); }
.q-meta { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 640px) { .q-head { grid-template-columns: auto minmax(0, 1fr); } .q-meta { grid-column: 1 / -1; justify-content: flex-start; } }
.dot-ok { width: 8px; height: 8px; border-radius: 50%; background: var(--green); display: inline-block; }
.stars-mini { font-size: 12px; color: var(--amber); letter-spacing: 1px; }
.q-body { padding: 4px 16px 18px; display: flex; flex-direction: column; gap: 18px; border-top: 1px solid var(--line); }
.q-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-top: 12px; }
.sec { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.sec-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.sec-head h4 { font-size: 15px; }
.intent { background: var(--surface-2); border-radius: 10px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px; font-size: 14.5px; }
ol.structure { display: flex; flex-direction: column; gap: 4px; font-size: 14.5px; }
ol.structure .en { color: var(--ink-3); font-size: 13px; }
.guide-approach { max-width: 72ch; }
.guide-bar span { font-family: var(--font-ui); }
ol.gsteps { list-style: none; padding: 0; display: flex; flex-direction: column; }
.gstep { display: grid; grid-template-columns: 6.4em minmax(0, 1fr); gap: 12px; padding: 12px 0; border-bottom: 1px dashed var(--line); }
.gstep:last-child { border-bottom: 0; }
.gstep-time { font-size: 12.5px; color: var(--ink-3); padding-top: 4px; }
.gstep-main { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.gstep-head { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
.gstep-ja { font-weight: 700; font-size: 16px; }
.gstep-en { color: var(--ink-2); font-size: 14px; }
.gstep-say { font-size: 14.5px; max-width: 72ch; }
.gstep-line { display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gstep-starter { font-weight: 500; font-size: 15.5px; }
.gstep-ex { color: var(--ink-2); border-left: 3px solid var(--indigo-soft); padding-left: 10px; }
@media (max-width: 560px) { .gstep { grid-template-columns: 1fr; gap: 2px; } }
.answer { font-size: 16.5px; display: flex; flex-direction: column; gap: 8px; }
.answer.short { font-size: 15.5px; }
.sent { border-radius: 3px; transition: background .15s; }
.sent.on { background: var(--indigo-soft); box-shadow: 0 0 0 2px var(--indigo-soft); }
.ph { background: var(--amber-soft); border-bottom: 2px solid var(--amber); border-radius: 3px; padding: 0 3px; }

        const prev = i > 0 ? val(weeks[i - 1], m.key) : '';

    card.append(h('div', {class: 'sec'}, h('div', {class: 'tools-row'}, linkify(q.id), h('span', {class: 'ja', lang: 'ja', text: q.questionJa})), h('p', {class: 'sub', text: str(bq.why)}),

function buildAnswersMd() {
  const parts = ['# My interview answers', '', 'Exported ' + new Date().toLocaleDateString('en-US', {year: 'numeric', month: 'short', day: 'numeric'}) + ' from Mensetsu Dojo.', ''];
  let n = 0;
  DATA.questions.forEach(q => {
    const d = Store.get('a_' + q.id); if (!d || !(str(d.text).trim() || (d.fb && d.fb.result && d.fb.result.corrected))) return;
    n++;
    parts.push('## ' + q.id + ' ' + q.questionJa, '', '_' + q.questionEn + '_', '');
    if (str(d.text).trim()) parts.push('### My answer', '', d.text.trim(), '');
    if (d.fb && d.fb.result && d.fb.result.corrected) parts.push('### AI-corrected version (' + new Date(d.fb.at).toLocaleDateString('en-US', {month: 'short', day: 'numeric'}) + ')', '', d.fb.result.corrected, '');
  });
  return n ? parts.join('\n') : '';
}
function buildPlanMd() {
  const P = DATA.plan; const s = S(); const ov = P.overview || {};
  const out = ['# 8-week Japanese interview plan', '', str(ov.goal), '', 'Time budget: ' + str(ov.weeklyTime), 'Week 1 starts: ' + toISO(startDate()), ''];
  const R = P.dailyRoutine || {};
  [['weekday', 'Weekday routine'], ['weekend', 'Weekend routine'], ['light', 'Light-day routine']].forEach(([k, t]) => {
    if (!arr(R[k]).length) return;
    out.push('## ' + t, '');
    arr(R[k]).forEach(b => out.push('- ' + b.min + ' min · ' + str(b.activity) + ': ' + str(b.detail)));
    out.push('');
  });
  arr(P.weeks).forEach(w => {
    const a = weekStart(w.week);
    out.push('## Week ' + w.week + ' (' + MD(a) + ' – ' + MD(addDays(a, 6)) + '): ' + str(w.theme) + ' / ' + str(w.themeJa), '', str(w.summary), '');
    if (arr(w.goals).length) { out.push('Goals:'); arr(w.goals).forEach(g => out.push('- ' + g)); out.push(''); }
    out.push('Milestone: ' + str(w.milestone), '', 'New questions: ' + arr(w.focusQuestions).join(', '), '');
    ['Daily'].concat(DAYS).forEach(day => arr(w.tasks).filter(t => t.day === day).forEach(t => out.push('- [' + (s.tasks[t.id] ? 'x' : ' ') + '] ' + day + ' · ' + t.min + ' min · ' + (TYPE_LABEL[t.type] || t.type) + ': ' + str(t.text))));
    out.push('');
    if (w.humanFeedback) out.push('Human feedback: ' + str(w.humanFeedback), '');
    if (w.lightVersion) out.push('Light version: ' + str(w.lightVersion), '');

  return out.join('\n');
}
function blobSave(filename, text) {
  try {
    const url = URL.createObjectURL(new Blob([text], {type: 'text/markdown;charset=utf-8'}));
    const a = h('a', {href: url, download: filename, hidden: true});
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
    toast('Saved to your downloads');
    return true;
  } catch (e) { return false; }
}
function saveFile(filename, md, btn) {
  const dl = Caps.downloads;
  // Outside claude.ai (a copy on your own host) the browser can download the file directly.
  if (!dl) { if (!window.claude && blobSave(filename, md)) return; copyText(md, btn); return; }
  Promise.resolve(dl.save({filename, data: md})).then(r => { if (r && r.status === 'saved') toast('Saved'); }, e => {
    const c = e && e.code;
    if (c === 'declined') return;
    if (c === 'rate_limited') { toast('A save prompt is already open.'); return; }
    toast('Saving is not available here, so the text is selected for copying instead.');
    fallbackCopy(md, btn);
  });
}
function exportAnswers(btn) {
  const md = buildAnswersMd();

  saveFile('my-interview-answers.md', md, btn);
}
